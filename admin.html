<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Lady Wear Collection</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFF9FA;
      --plum: #3B0B17;
      --berry: #7A1C38;
      --rose: #E8C5CE;
      --gold: #D4AF37;
      --card-bg: #FFFFFF;
      --text: #2C1820;
      --text-muted: #6B515B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 420px; margin: 0 auto; padding-bottom: 40px; }

    .top-header { text-align: center; margin-bottom: 20px; padding: 10px 0; border-bottom: 1px solid var(--rose); }
    .top-header h1 { font-family: 'Cinzel', serif; color: var(--plum); font-size: 20px; }
    .top-header p { font-size: 10px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--rose); padding: 14px 8px; border-radius: 14px; text-align: center; box-shadow: 0 4px 15px rgba(59,11,23,0.04); }
    .stat-num { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; color: var(--plum); }
    .stat-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    .admin-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
    .admin-tab-btn { background: #FAF2F4; border: 1px solid var(--rose); color: var(--plum); padding: 10px 14px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .admin-tab-btn.active { background: var(--plum); color: #FFF; border-color: var(--plum); }

    .card { background: var(--card-bg); padding: 20px; border-radius: 20px; box-shadow: 0 8px 25px rgba(59, 11, 23, 0.06); border: 1px solid var(--rose); margin-bottom: 20px; }
    .card-title { font-family: 'Cinzel', serif; color: var(--plum); font-size: 16px; font-weight: 700; margin-bottom: 14px; }

    .form-group { margin-bottom: 14px; text-align: left; }
    label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 5px; color: var(--plum); text-transform: uppercase; }
    input, select { width: 100%; padding: 12px; border: 1px solid var(--rose); border-radius: 10px; font-size: 14px; outline: none; background: #FAF2F4; color: var(--text); }
    
    .btn-primary { width: 100%; background: var(--plum); color: #FFF; border: none; padding: 14px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; text-transform: uppercase; }
    .btn-secondary { background: #FAF2F4; color: var(--plum); border: 1px solid var(--rose); margin-top: 8px; }
    .btn-danger { background: #FFEBEE; color: #C62828; border: 1px solid #FFCDD2; }

    .member-item { background: #FAF2F4; padding: 14px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--rose); }
    .member-item h4 { font-family: 'Cinzel', serif; color: var(--plum); font-size: 14px; }
    .member-item p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    
    .badge { display: inline-block; background: #E8C5CE; color: var(--plum); padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; margin-top: 6px; margin-right: 4px; }

    .alert { padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; text-align: center; }
    .alert-error { background: #FFEBEE; color: #C62828; }
    .alert-success { background: #E8F5E9; color: #2E7D32; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-header">
      <h1>Staff Portal</h1>
      <p>Lady Wear Collection</p>
    </div>

    <div id="msgBox" class="alert hidden"></div>

    <div id="loginSec" class="card">
      <div class="card-title">Admin Login</div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="adminEmail" placeholder="admin@ladywear.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPass" placeholder="••••••••">
      </div>
      <button id="loginBtn" class="btn-primary" type="button">Login to Portal</button>
    </div>

    <div id="dashSec" class="hidden">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-num" id="statMembers">0</div>
          <div class="stat-label">Members</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="statStamps">0</div>
          <div class="stat-label">Stamps issued</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="statCoupons">0</div>
          <div class="stat-label">Coupons created</div>
        </div>
      </div>

      <div class="admin-tabs">
        <button class="admin-tab-btn active" id="subTabCard" type="button">Issue scratch card</button>
        <button class="admin-tab-btn" id="subTabVerify" type="button">Verify coupon</button>
        <button class="admin-tab-btn" id="subTabMembers" type="button">All members</button>
      </div>

      <div class="card" id="panelCard">
        <div class="card-title">Issue Custom Scratch Card</div>
        <div class="form-group">
          <label>Member Mobile Number</label>
          <input type="tel" id="issuePhone" placeholder="10-digit mobile" maxlength="10">
        </div>
        <div class="form-group">
          <label>Scratch Card Reward</label>
          <select id="issueReward">
            <option value="5% off">5% off</option>
            <option value="10% off">10% off</option>
            <option value="₹50 off">₹50 off</option>
            <option value="₹100 off">₹100 off</option>
            <option value="Free gift" selected>Free gift</option>
          </select>
        </div>
        <div class="form-group">
          <label>Minimum Purchase (₹)</label>
          <input type="number" id="issueMinSpend" value="500">
        </div>
        <div class="form-group">
          <label>Expiry (days)</label>
          <input type="number" id="issueExpiryDays" value="30">
        </div>
        <button id="createCardBtn" class="btn-primary" type="button">Create scratch card</button>
      </div>

      <div class="card hidden" id="panelVerify">
        <div class="card-title">Verify & Redeem Coupon</div>
        <div class="form-group">
          <label>Enter Coupon Code</label>
          <input type="text" id="verifyCodeInp" placeholder="e.g. LW-19LFMTEP" style="text-transform:uppercase;">
        </div>
        <button id="verifyCodeBtn" class="btn-primary" type="button">Verify & Use Coupon</button>
      </div>

      <div class="card hidden" id="panelMembers">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <div class="card-title" style="margin-bottom:0;">Members Directory</div>
          <button id="logoutBtn" style="background:none; border:none; color:#C62828; font-weight:700; font-size:11px; cursor:pointer;" type="button">LOGOUT</button>
        </div>
        <div class="form-group" style="margin-bottom: 14px;">
          <input type="text" id="searchInp" placeholder="Search name or mobile...">
        </div>
        <div id="membersListContainer">Loading members...</div>
        <button id="exportCsvBtn" class="btn-primary btn-secondary" style="margin-top: 15px;" type="button">📥 Export Customers CSV</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCXskxp0w8tAljV-6mCz-FN5sCuJagFpN4",
      authDomain: "ladywear-collection-c9284.firebaseapp.com",
      databaseURL: "https://ladywear-collection-c9284-default-rtdb.firebaseio.com",
      projectId: "ladywear-collection-c9284",
      storageBucket: "ladywear-collection-c9284.firebasestorage.app",
      messagingSenderId: "276056105346",
      appId: "1:276056105346:web:e54c9912b066032691ef9b",
      measurementId: "G-Z863Y8GPSV"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let allMembers = [];

    function showMsg(text, isError = false) {
      const box = document.getElementById('msgBox');
      box.textContent = text;
      box.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 5000);
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('loginSec').classList.add('hidden');
        document.getElementById('dashSec').classList.remove('hidden');
        loadDashboardData();
      } else {
        document.getElementById('loginSec').classList.remove('hidden');
        document.getElementById('dashSec').classList.add('hidden');
      }
    });

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('adminEmail').value.trim();
      const pass = document.getElementById('adminPass').value.trim();
      if (!email || !pass) return showMsg('Enter email and password', true);
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        showMsg('Login successful!');
      } catch (e) {
        showMsg('Login failed: ' + e.message, true);
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

    const subTabCard = document.getElementById('subTabCard');
    const subTabVerify = document.getElementById('subTabVerify');
    const subTabMembers = document.getElementById('subTabMembers');

    const panelCard = document.getElementById('panelCard');
    const panelVerify = document.getElementById('panelVerify');
    const panelMembers = document.getElementById('panelMembers');

    subTabCard.addEventListener('click', () => {
      panelCard.classList.remove('hidden'); panelVerify.classList.add('hidden'); panelMembers.classList.add('hidden');
      subTabCard.classList.add('active'); subTabVerify.classList.remove('active'); subTabMembers.classList.remove('active');
    });
    subTabVerify.addEventListener('click', () => {
      panelVerify.classList.remove('hidden'); panelCard.classList.add('hidden'); panelMembers.classList.add('hidden');
      subTabVerify.classList.add('active'); subTabCard.classList.remove('active'); subTabMembers.classList.remove('active');
    });
    subTabMembers.addEventListener('click', () => {
      panelMembers.classList.remove('hidden'); panelCard.classList.add('hidden'); panelVerify.classList.add('hidden');
      subTabMembers.classList.add('active'); subTabCard.classList.remove('active'); subTabVerify.classList.remove('active');
    });

    async function loadDashboardData() {
      try {
        const snap = await getDocs(collection(db, "customers"));
        allMembers = [];
        let totalStamps = 0;
        let totalCoupons = 0;

        snap.forEach(d => {
          const m = { id: d.id, ...d.data() };
          allMembers.push(m);
          totalStamps += (m.stamps || 0);
          if (m.couponCode) totalCoupons++;
        });

        document.getElementById('statMembers').textContent = allMembers.length;
        document.getElementById('statStamps').textContent = totalStamps;
        document.getElementById('statCoupons').textContent = totalCoupons;

        renderMembersList(allMembers);
      } catch (e) {
        showMsg('Failed to load data: ' + e.message, true);
      }
    }

    function renderMembersList(list) {
      const container = document.getElementById('membersListContainer');
      if (list.length === 0) {
        container.innerHTML = '<p style="font-size:12px; color:var(--text-muted); text-align:center;">No members found.</p>';
        return;
      }
      container.innerHTML = list.map(m => `
        <div class="member-item">
          <h4>${m.name || 'Unnamed'}</h4>
          <p>📱 ${m.phone || 'No phone'}</p>
          <div>
            <span class="badge">Stamps: ${m.stamps || 0}/5</span>
            <span class="badge">${m.rewardType || 'No reward'}</span>
            ${m.couponCode ? `<span class="badge" style="background:var(--plum); color:#FFF;">${m.couponCode}</span>` : ''}
            ${m.rewardIssued ? '<span class="badge" style="background:#2E7D32; color:#FFF;">Claimed</span>' : ''}
          </div>
          <div style="margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;">
            <button class="btn-primary" style="padding:6px; font-size:10px; flex:1;" onclick="window.addStamp('${m.id}', ${m.stamps || 0})">+1 Stamp</button>
            <button class="btn-primary btn-danger" style="padding:6px; font-size:10px; flex:1; margin-top:0;" onclick="window.resetStamps('${m.id}')">🔄 Reset 0</button>
            <button class="btn-primary btn-secondary" style="padding:6px; font-size:10px; flex:1; margin-top:0;" onclick="window.sendWhatsApp('${m.phone}', '${m.name}', ${m.stamps || 0})">WhatsApp</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('searchInp').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allMembers.filter(m => (m.name && m.name.toLowerCase().includes(term)) || (m.phone && m.phone.includes(term)));
      renderMembersList(filtered);
    });

    document.getElementById('createCardBtn').addEventListener('click', async () => {
      const phone = document.getElementById('issuePhone').value.trim();
      const reward = document.getElementById('issueReward').value;
      const minSpend = document.getElementById('issueMinSpend').value;
      const expiryDays = document.getElementById('issueExpiryDays').value;

      if (phone.length !== 10) return showMsg('Enter valid 10-digit mobile number', true);

      try {
        const ref = doc(db, "customers", phone);
        const snap = await getDoc(ref);
        const coupon = 'LW-' + Math.random().toString(36).substring(2, 10).toUpperCase();

        if (snap.exists()) {
          await updateDoc(ref, {
            rewardReady: true,
            rewardType: reward,
            couponCode: coupon,
            minSpend: minSpend,
            expiryDays: expiryDays,
            isScratched: false,
            rewardIssued: false
          });
        } else {
          await setDoc(ref, {
            name: 'Customer',
            phone: phone,
            pin: '1234',
            stamps: 5,
            rewardReady: true,
            rewardType: reward,
            couponCode: coupon,
            minSpend: minSpend,
            expiryDays: expiryDays,
            isScratched: false,
            rewardIssued: false
          });
        }
        showMsg('✅ Scratch card issued successfully!');
        document.getElementById('issuePhone').value = '';
        loadDashboardData();
      } catch (e) {
        showMsg('Error issuing card: ' + e.message, true);
      }
    });

    document.getElementById('verifyCodeBtn').addEventListener('click', async () => {
      const code = document.getElementById('verifyCodeInp').value.trim().toUpperCase();
      if (!code) return showMsg('Enter coupon code', true);

      const member = allMembers.find(m => m.couponCode === code);
      if (!member) return showMsg('❌ Invalid Coupon Code!', true);
      if (member.rewardIssued) return showMsg('⚠️ Coupon already redeemed!', true);

      try {
        await updateDoc(doc(db, "customers", member.id), { rewardIssued: true });
        showMsg(`✅ Success! Coupon verified for ${member.name || member.phone} (${member.rewardType}).`);
        document.getElementById('verifyCodeInp').value = '';
        loadDashboardData();
      } catch (e) {
        showMsg('Verification failed: ' + e.message, true);
      }
    });

    window.addStamp = async (id, currentStamps) => {
      if (currentStamps >= 5) return showMsg('Already at max stamps!', true);
      const newStamps = currentStamps + 1;
      const isReady = newStamps >= 5;
      
      const updateData = {
        stamps: newStamps,
        rewardReady: isReady
      };

      if (isReady) {
        updateData.couponCode = 'LW-' + Math.random().toString(36).substring(2, 10).toUpperCase();
        updateData.rewardType = "Free gift";
        updateData.minSpend = "500";
        updateData.isScratched = false;
        updateData.rewardIssued = false;
      }

      try {
        await updateDoc(doc(db, "customers", id), updateData);
        showMsg('Stamp added successfully!');
        loadDashboardData();
      } catch (e) {
        showMsg('Failed: ' + e.message, true);
      }
    };

    window.resetStamps = async (id) => {
      if (!confirm('Kya aap waqai is customer ke stamps 0 karna chahte hain?')) return;
      try {
        await updateDoc(doc(db, "customers", id), {
          stamps: 0,
          rewardReady: false,
          rewardIssued: false,
          isScratched: false,
          couponCode: ""
        });
        showMsg('Stamps reset to 0 successfully!');
        loadDashboardData();
      } catch (e) {
        showMsg('Failed to reset: ' + e.message, true);
      }
    };

    window.sendWhatsApp = (phone, name, stamps) => {
      const msg = `Hello ${name || 'Customer'}! 🎉\nYour Lady Wear Collection loyalty card has been updated. Total stamps: ${stamps}/5.\nCheck your rewards here: https://rali3126071-bot.github.io/Ladywear-collection-/`;
      window.open(`https://wa.me/91${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    };

    document.getElementById('exportCsvBtn').addEventListener('click', () => {
      if (!allMembers.length) return showMsg('No data to export', true);
      let csv = 'Name,Phone,Stamps,Reward,Coupon,Claimed\n';
      allMembers.forEach(m => {
        csv += `"${m.name || ''}","${m.phone || ''}",${m.stamps || 0},"${m.rewardType || ''}","${m.couponCode || ''}",${m.rewardIssued ? 'Yes' : 'No'}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'lady_wear_customers.csv';
      a.click();
    });
  </script>
</body>
</html>
