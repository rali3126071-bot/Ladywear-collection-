<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Lady Wear Collection</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3B0B17;
      --secondary: #9E1B42;
      --accent: #D4AF37;
      --bg: #FFF9FA;
      --card-bg: #FFFFFF;
      --text: #2C1820;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
    .header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #F3E5E8; }
    .header h1 { font-family: 'Playfair Display', serif; color: var(--primary); font-size: 24px; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(59, 11, 23, 0.06); margin-bottom: 20px; border: 1px solid #F3E5E8; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--primary); }
    input { width: 100%; padding: 12px; border: 1px solid #E2D0D4; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus { border-color: var(--secondary); }
    .btn { width: 100%; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-gold { background: linear-gradient(135deg, #D4AF37, #AA7C11); color: #fff; }
    .btn-secondary { background: #6C757D; }
    .hidden { display: none !important; }
    .member-item { background: #FAF0F2; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #E8C5CE; }
    .member-info h4 { color: var(--primary); font-size: 16px; }
    .member-info p { font-size: 13px; color: #666; margin-top: 2px; }
    .stamp-badge { display: inline-block; background: var(--secondary); color: white; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; margin-top: 6px; }
    .action-btns { display: flex; gap: 8px; margin-top: 10px; }
    .action-btns button { flex: 1; padding: 8px; font-size: 12px; border-radius: 6px; }
    .alert { padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; }
    .alert-error { background: #FFEBEE; color: #C62828; }
    .alert-success { background: #E8F5E9; color: #2E7D32; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Lady Wear Collection</h1>
    <p style="font-size: 12px; color: #777;">Admin Management Portal</p>
  </div>

  <div id="msgBox" class="alert hidden"></div>

  <!-- Admin Login Form -->
  <div id="loginSec" class="card">
    <h2 style="font-size: 18px; margin-bottom: 15px; color: var(--primary);">Staff Login</h2>
    <div class="form-group">
      <label>Admin Email</label>
      <input type="email" id="adminEmail" placeholder="admin@ladywear.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="adminPass" placeholder="••••••••">
    </div>
    <button id="loginBtn" class="btn">Login to Dashboard</button>
  </div>

  <!-- Admin Dashboard -->
  <div id="dashSec" class="hidden">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="font-size: 16px; color: var(--primary);">Customer Lookup</h3>
        <button id="logoutBtn" style="background: none; border: none; color: var(--secondary); font-size: 12px; font-weight: 600; cursor: pointer;">Logout</button>
      </div>
      <div class="form-group">
        <input type="text" id="searchInp" placeholder="Search by name or 10-digit mobile...">
      </div>
      <button id="exportBtn" class="btn btn-gold" style="margin-top: 5px;">📥 Export All Customers (CSV)</button>
    </div>

    <div class="card">
      <h3 style="font-size: 16px; margin-bottom: 12px; color: var(--primary);">Members List</h3>
      <div id="membersList">Loading members...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let allMembers = [];

    function showMsg(text, isError = false) {
      const box = document.getElementById('msgBox');
      box.textContent = text;
      box.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 4000);
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('loginSec').classList.add('hidden');
        document.getElementById('dashSec').classList.remove('hidden');
        loadMembers();
      } else {
        document.getElementById('loginSec').classList.remove('hidden');
        document.getElementById('dashSec').classList.add('hidden');
      }
    });

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('adminEmail').value.trim();
      const pass = document.getElementById('adminPass').value.trim();
      if (!email || !pass) return showMsg('Please enter both email and password', true);
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        showMsg('Login successful!');
      } catch (e) {
        showMsg('Login failed: ' + e.message, true);
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

    async function loadMembers() {
      try {
        const querySnapshot = await getDocs(collection(db, "customers"));
        allMembers = [];
        querySnapshot.forEach((doc) => {
          allMembers.push({ id: doc.id, ...doc.data() });
        });
        renderMembers(allMembers);
      } catch (e) {
        showMsg('Error fetching members: ' + e.message, true);
      }
    }

    function renderMembers(list) {
      const container = document.getElementById('membersList');
      if (list.length === 0) {
        container.innerHTML = '<p style="font-size: 13px; color: #777;">No customer records found.</p>';
        return;
      }
      container.innerHTML = list.map(m => `
        <div class="member-item">
          <div class="member-info">
            <h4>${m.name || 'Unnamed'}</h4>
            <p>📱 ${m.phone || 'No phone'}</p>
            <span class="stamp-badge">Stamps: ${m.stamps || 0} / 5</span>
            ${m.rewardReady ? '<span class="stamp-badge" style="background:#D4AF37;">🎁 Reward Ready</span>' : ''}
            ${m.rewardIssued ? '<span class="stamp-badge" style="background:#6C757D;">✓ Reward Claimed</span>' : ''}
          </div>
          <div class="action-btns">
            <button class="btn" onclick="addStamp('${m.id}', ${m.stamps || 0})">+1 Stamp (₹500+)</button>
            ${m.rewardReady && !m.rewardIssued ? `<button class="btn btn-gold" onclick="claimReward('${m.id}')">Issue Reward</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    document.getElementById('searchInp').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allMembers.filter(m => 
        (m.name && m.name.toLowerCase().includes(term)) || 
        (m.phone && m.phone.includes(term))
      );
      renderMembers(filtered);
    });

    window.addStamp = async (id, currentStamps) => {
      if (currentStamps >= 5) return showMsg('Already at maximum 5 stamps!', true);
      const newCount = currentStamps + 1;
      const isReady = newCount === 5;
      try {
        await updateDoc(doc(db, "customers", id), {
          stamps: newCount,
          rewardReady: isReady
        });
        showMsg('Stamp added successfully!');
        loadMembers();
      } catch (e) {
        showMsg('Failed to update stamp: ' + e.message, true);
      }
    };

    window.claimReward = async (id) => {
      try {
        await updateDoc(doc(db, "customers", id), {
          rewardIssued: true
        });
        showMsg('Reward marked as issued!');
        loadMembers();
      } catch (e) {
        showMsg('Failed to update reward: ' + e.message, true);
      }
    };

    document.getElementById('exportBtn').addEventListener('click', () => {
      if (!allMembers.length) return showMsg('No data to export', true);
      let csv = 'Name,Phone,Stamps,Reward Ready,Reward Issued\n';
      allMembers.forEach(m => {
        csv += `"${m.name || ''}","${m.phone || ''}",${m.stamps || 0},${m.rewardReady ? 'Yes' : 'No'},${m.rewardIssued ? 'Yes' : 'No'}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', 'lady_wear_customers.csv');
      a.click();
    });
  </script>
</body>
</html>
