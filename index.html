<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lady Wear Collection — VIP Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F0A0C;
      --card-bg: #1A1216;
      --gold: #D4AF37;
      --gold-light: #F3E5AB;
      --text: #F7F4F0;
      --text-muted: #B3A4A8;
      --border: #3A2A30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 420px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 24px; letter-spacing: 2px; }
    .header p { font-size: 11px; color: var(--text-muted); letter-spacing: 3px; margin-top: 4px; text-transform: uppercase; }
    
    .card { background: var(--card-bg); padding: 24px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--border); margin-bottom: 20px; }
    
    .tabs { display: flex; background: #24181E; border-radius: 12px; padding: 4px; margin-bottom: 20px; border: 1px solid var(--border); }
    .tab-btn { flex: 1; border: none; background: transparent; padding: 10px; font-size: 12px; font-weight: 600; color: var(--text-muted); border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .tab-btn.active { background: var(--gold); color: var(--bg); font-weight: 700; }
    
    .form-group { margin-bottom: 14px; text-align: left; }
    label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 6px; color: var(--gold-light); letter-spacing: 1px; text-transform: uppercase; }
    input { width: 100%; padding: 12px 14px; background: #120C0F; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; color: var(--text); outline: none; }
    input:focus { border-color: var(--gold); }
    
    .btn { width: 100%; background: linear-gradient(135deg, #D4AF37, #AA7C11); color: #0F0A0C; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; }
    
    .loyalty-card { background: linear-gradient(135deg, #1A1216, #2C1E25); color: #FFF; padding: 22px; border-radius: 18px; border: 1px solid var(--gold); position: relative; overflow: hidden; }
    .card-title { font-family: 'Cinzel', serif; color: var(--gold); font-size: 18px; font-weight: 700; }
    .card-member { font-size: 13px; margin-bottom: 15px; color: var(--text-muted); }
    
    .stamps-grid { display: flex; justify-content: space-between; margin: 20px 0; }
    .stamp-circle { width: 50px; height: 50px; border-radius: 50%; border: 2px dashed var(--gold); display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--gold); background: rgba(212,175,55,0.03); }
    .stamp-circle.active { background: var(--gold); color: var(--bg); border-style: solid; font-weight: bold; }
    
    .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-top: 15px; }
    .progress-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.4s ease; }
    
    .scratch-container { margin-top: 15px; background: #120C0F; border: 1px dashed var(--gold); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; }
    .scratch-hidden { filter: blur(6px); user-select: none; color: var(--gold); font-weight: 700; font-size: 15px; }
    .coupon-code-box { display: inline-block; background: var(--gold); color: var(--bg); font-weight: 800; padding: 4px 10px; border-radius: 6px; margin-top: 6px; font-size: 14px; letter-spacing: 1px; }
    
    .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-top: 12px; text-align: center; width: 100%; text-transform: uppercase; letter-spacing: 1px; }
    .badge-ready { background: var(--gold); color: var(--bg); }
    .badge-progress { background: rgba(255,255,255,0.08); color: var(--text-muted); }
    .badge-issued { background: #2E7D32; color: #FFF; }

    .alert { padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 15px; text-align: center; }
    .alert-error { background: #3B0B17; color: #FF8A80; border: 1px solid #7F1D1D; }
    .alert-success { background: #064E3B; color: #6EE7B7; border: 1px solid #065F46; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Lady Wear</h1>
      <p>VIP Loyalty Club</p>
    </div>

    <div id="msgBox" class="alert hidden"></div>

    <div id="authSection" class="card">
      <div class="tabs">
        <button id="tabJoin" class="tab-btn active">Join Club</button>
        <button id="tabView" class="tab-btn">Access Card</button>
      </div>

      <div id="joinForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="joinName" placeholder="Enter your name">
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" id="joinPhone" placeholder="10-digit mobile number" maxlength="10">
        </div>
        <div class="form-group">
          <label>4-Digit Security PIN</label>
          <input type="password" id="joinPin" placeholder="Create 4-digit PIN" maxlength="4">
        </div>
        <button type="button" id="joinBtn" class="btn">Join VIP Club</button>
      </div>

      <div id="viewForm" class="hidden">
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" id="viewPhone" placeholder="Enter mobile number" maxlength="10">
        </div>
        <div class="form-group">
          <label>4-Digit Security PIN</label>
          <input type="password" id="viewPin" placeholder="Enter 4-digit PIN" maxlength="4">
        </div>
        <button type="button" id="viewBtn" class="btn">View My Card</button>
      </div>
    </div>

    <div id="cardSection" class="hidden">
      <div class="loyalty-card">
        <div class="card-title">VIP Membership</div>
        <div class="card-member" id="cardMemberName">Member</div>
        
        <div class="stamps-grid">
          <div class="stamp-circle" id="stamp-1">1</div>
          <div class="stamp-circle" id="stamp-2">2</div>
          <div class="stamp-circle" id="stamp-3">3</div>
          <div class="stamp-circle" id="stamp-4">4</div>
          <div class="stamp-circle" id="stamp-5">🎁</div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

        <div id="scratchBoxContainer" class="hidden">
          <div class="scratch-container" id="scratchCardElem">
            <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 5px;">🎉 REWARD UNLOCKED!</p>
            <div id="scratchContent" class="scratch-hidden">Tap here to scratch & reveal offer!</div>
          </div>
        </div>

        <div id="statusBadge" class="status-badge badge-progress">0 of 5 Stamps Collected</div>
      </div>
      <button id="logoutCardBtn" style="width:100%; margin-top: 15px; background: none; border: none; color: var(--text-muted); font-size: 12px; font-weight:600; cursor:pointer; text-transform:uppercase;">Switch Account</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const msgBox = document.getElementById('msgBox');
    function showMsg(text, isError = false) {
      msgBox.textContent = text;
      msgBox.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
      msgBox.classList.remove('hidden');
      setTimeout(() => msgBox.classList.add('hidden'), 5000);
    }

    document.getElementById('tabJoin').addEventListener('click', () => {
      document.getElementById('tabJoin').classList.add('active');
      document.getElementById('tabView').classList.remove('active');
      document.getElementById('joinForm').classList.remove('hidden');
      document.getElementById('viewForm').classList.add('hidden');
    });

    document.getElementById('tabView').addEventListener('click', () => {
      document.getElementById('tabView').classList.add('active');
      document.getElementById('tabJoin').classList.remove('active');
      document.getElementById('viewForm').classList.remove('hidden');
      document.getElementById('joinForm').classList.add('hidden');
    });

    const savedPhone = localStorage.getItem('lwc_member_phone');
    if (savedPhone) { fetchCustomer(savedPhone); }

    document.getElementById('joinBtn').addEventListener('click', async () => {
      const name = document.getElementById('joinName').value.trim();
      const phone = document.getElementById('joinPhone').value.trim();
      const pin = document.getElementById('joinPin').value.trim();

      if (!name || phone.length !== 10 || pin.length !== 4) {
        return showMsg('Enter valid Name, 10-digit Phone & 4-digit PIN', true);
      }

      try {
        await signInAnonymously(auth);
        const ref = doc(db, "customers", phone);
        const snap = await getDoc(ref);

        if (snap.exists()) {
          return showMsg('Number already registered! Access card instead.', true);
        }

        await setDoc(ref, { 
          name, 
          phone, 
          pin, 
          stamps: 0, 
          rewardReady: false, 
          rewardIssued: false, 
          rewardType: "Get 10% off", 
          couponCode: "", 
          isScratched: false 
        });

        localStorage.setItem('lwc_member_phone', phone);
        renderCard({ name, stamps: 0, rewardReady: false, rewardIssued: false, rewardType: "Get 10% off", couponCode: "", isScratched: false });
        showMsg('Welcome to Lady Wear VIP Club!');
      } catch (e) { 
        showMsg('Error: ' + e.message, true); 
      }
    });

    document.getElementById('viewBtn').addEventListener('click', async () => {
      const phone = document.getElementById('viewPhone').value.trim();
      const pin = document.getElementById('viewPin').value.trim();

      if (phone.length !== 10 || pin.length !== 4) {
        return showMsg('Enter 10-digit Phone and 4-digit PIN', true);
      }

      try {
        await signInAnonymously(auth);
        const snap = await getDoc(doc(db, "customers", phone));
        if (!snap.exists()) return showMsg('Account not found! Please join first.', true);
        const data = snap.data();
        if (data.pin !== pin) return showMsg('Incorrect PIN!', true);
        localStorage.setItem('lwc_member_phone', phone);
        renderCard(data);
      } catch (e) { 
        showMsg('Error: ' + e.message, true); 
      }
    });

    async function fetchCustomer(phone) {
      try {
        await signInAnonymously(auth);
        const snap = await getDoc(doc(db, "customers", phone));
        if (snap.exists()) renderCard(snap.data());
      } catch (e) {}
    }

    let currentCustomerPhone = null;

    function renderCard(data) {
      currentCustomerPhone = data.phone;
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('cardSection').classList.remove('hidden');
      document.getElementById('cardMemberName').textContent = data.name;
      const stamps = data.stamps || 0;
      
      for (let i = 1; i <= 5; i++) {
        const el = document.getElementById(`stamp-${i}`);
        if (i <= stamps) { 
          el.classList.add('active'); 
          el.textContent = '✓'; 
        } else { 
          el.classList.remove('active'); 
          el.textContent = i === 5 ? '🎁' : i; 
        }
      }
      document.getElementById('progressFill').style.width = `${(stamps / 5) * 100}%`;

      const badge = document.getElementById('statusBadge');
      const scratchContainer = document.getElementById('scratchBoxContainer');
      const scratchElem = document.getElementById('scratchContent');

      if (data.rewardIssued) {
        badge.textContent = '✓ Reward Claimed at Shop';
        badge.className = 'status-badge badge-issued';
        scratchContainer.classList.add('hidden');
      } else if (stamps >= 5 || data.rewardReady) {
        badge.textContent = '🎉 Reward Unlocked!';
        badge.className = 'status-badge badge-ready';
        scratchContainer.classList.remove('hidden');
        
        if (data.isScratched) {
          scratchElem.classList.remove('scratch-hidden');
          scratchElem.innerHTML = `<div>${data.rewardType || "Special Gift"}</div><div class="coupon-code-box">Code: ${data.couponCode || 'LWC-VIP'}</div>`;
        } else {
          scratchElem.classList.add('scratch-hidden');
          scratchElem.textContent = "Tap here to scratch & reveal offer!";
        }
      } else {
        badge.textContent = `${stamps} of 5 Stamps Collected`;
        badge.className = 'status-badge badge-progress';
        scratchContainer.classList.add('hidden');
      }
    }

    document.getElementById('scratchCardElem').addEventListener('click', async () => {
      if (!currentCustomerPhone) return;
      try {
        await updateDoc(doc(db, "customers", currentCustomerPhone), { isScratched: true });
        const snap = await getDoc(doc(db, "customers", currentCustomerPhone));
        if (snap.exists()) renderCard(snap.data());
      } catch(e) {
        showMsg('Failed to scratch card', true);
      }
    });

    document.getElementById('logoutCardBtn').addEventListener('click', () => {
      localStorage.removeItem('lwc_member_phone');
      document.getElementById('cardSection').classList.add('hidden');
      document.getElementById('authSection').classList.remove('hidden');
    });
  </script>
</body>
</html>
